[theme]
base = "dark"
primaryColor = "#60a5fa"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#121c31"
textColor = "#f3f7ff"
# Square corners so the app fills the viewport (including ?embed=true).
baseRadius = "none"
buttonRadius = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
