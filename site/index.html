<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>MarketsLite — Attention ahead of earnings</title>
    <meta
      name="description"
      content="Live MarketsLite dashboard — companies ranked by investor attention ahead of earnings."
    />
    <link rel="canonical" href="https://marketslite.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MarketsLite" />
    <meta property="og:url" content="https://marketslite.com/" />
    <meta property="og:title" content="MarketsLite — Attention ahead of earnings" />
    <meta
      property="og:description"
      content="See which companies are picking up investor attention before earnings this week."
    />
    <meta property="og:image" content="https://marketslite.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MarketsLite — Attention ahead of earnings" />
    <meta
      name="twitter:description"
      content="See which companies are picking up investor attention before earnings this week."
    />
    <meta name="twitter:image" content="https://marketslite.com/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b1120;
        color-scheme: dark;
      }

      .frame-wrap {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1120;
      }

      /*
        Slight overscan clips Streamlit's rounded embed chrome without eating
        mobile side padding. Extra height at the bottom hides the Built with
        Streamlit / Fullscreen strip; the app adds bottom padding so the last
        controls stay above that clip.
      */
      iframe {
        position: absolute;
        top: -6px;
        left: -6px;
        width: calc(100% + 12px);
        height: calc(100% + 56px);
        border: 0;
        background: #0b1120;
      }
    </style>
  </head>
  <body>
    <div class="frame-wrap">
      <iframe
        src="https://marketslite.streamlit.app/?embed=true"
        title="MarketsLite Dashboard"
        allow="clipboard-write"
        loading="eager"
      ></iframe>
    </div>
  </body>
</html>
